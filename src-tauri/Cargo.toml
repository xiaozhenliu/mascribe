[package]
name = "mac-voice-input"
version = "0.2.0"
description = "macOS voice input tool with local SenseVoice transcription"
authors = ["you"]
edition = "2021"

[lib]
name = "mac_voice_input_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-rs = { version = "0.6", features = ["download-binaries"] }
cpal = "0.15"
arboard = "3"
anyhow = "1"
dirs = "5"
hound = "3.5"
libc = "0.2"
log = "0.4"
chrono = "0.4"
llama-cpp-2 = { version = "0.1", features = ["sampler"] }
encoding_rs = "0.8"
ureq = { version = "2", features = ["json"] }
image = { version = "0.24", default-features = false, features = ["png"] }
base64 = "0.21"
once_cell = "1.19"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dxgi",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
] }
anyhow = "1"
dirs = "5"
hound = "3.5"
libc = "0.2"
log = "0.4"
chrono = "0.4"
llama-cpp-2 = { version = "0.1", features = ["sampler"] }
encoding_rs = "0.8"
ureq = { version = "2", features = ["json"] }
image = { version = "0.24", default-features = false, features = ["png"] }
base64 = "0.21"
once_cell = "1.19"
