[package]
name = "mac-voice-input"
version = "0.2.0"
description = "macOS voice input tool with local SenseVoice transcription"
authors = ["you"]
edition = "2021"

[lib]
name = "mac_voice_input_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-rs = { version = "0.6", features = ["download-binaries"] }
cpal = "0.15"
arboard = "3"
core-graphics = "0.24"
core-foundation = "0.10"
anyhow = "1"
dirs = "5"
hound = "3.5"
libc = "0.2"
log = "0.4"
chrono = "0.4"
llama-cpp-2 = { version = "0.1", features = ["sampler"] }
encoding_rs = "0.8"
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
